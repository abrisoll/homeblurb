[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 requires Node 20.9+; pin explicitly so Netlify's default
  # build image doesn't serve an older Node version.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Explicit, since auto-detection of the default netlify/functions/ path
  # doesn't reliably kick in alongside the Next.js build plugin.
  directory = "netlify/functions"

# The neighborhood-profile cache (src/lib/db.ts) lives in Turso, a hosted
# libSQL database, reached over HTTP via TURSO_DATABASE_URL and
# TURSO_AUTH_TOKEN — set both in Netlify's Site settings > Environment
# variables. No local file or native module involved, so it persists
# reliably across deploys, cold starts, and concurrent function instances.
