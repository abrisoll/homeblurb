<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HomeBlurb logo">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset="0.45" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7ccb4d"/>
      <stop offset="0.55" stop-color="#4aa32e"/>
      <stop offset="1" stop-color="#2e7d1f"/>
    </linearGradient>
  </defs>

  <!-- ===== House monogram: left half dark, right half green ===== -->
  <!-- Left (dark) half: roof slope + body -->
  <path d="M500 88 L500 430 L310 430 L310 252 Z" fill="url(#darkGrad)"/>
  <!-- Right (green) half -->
  <path d="M500 88 L690 252 L690 430 L500 430 Z" fill="url(#greenGrad)"/>

  <!-- Door notch (echoes the notch in the Megapixeler M) -->
  <rect x="455" y="332" width="90" height="98" fill="#ffffff"/>

  <!-- White pixel cutouts inside the letterform -->
  <rect x="352" y="284" width="36" height="36" fill="#ffffff"/>
  <rect x="410" y="352" width="26" height="26" fill="#ffffff"/>
  <rect x="612" y="284" width="36" height="36" fill="#ffffff"/>
  <rect x="564" y="352" width="26" height="26" fill="#ffffff"/>
  <rect x="472" y="220" width="24" height="24" fill="#ffffff"/>

  <!-- Dissolving pixels — dark, drifting left -->
  <rect x="248" y="196" width="32" height="32" fill="#2f2f2f"/>
  <rect x="200" y="252" width="24" height="24" fill="#1c1c1c"/>
  <rect x="252" y="304" width="28" height="28" fill="#3a3a3a"/>
  <rect x="212" y="352" width="18" height="18" fill="#2a2a2a"/>
  <rect x="162" y="218" width="16" height="16" fill="#444444"/>
  <rect x="168" y="306" width="14" height="14" fill="#1c1c1c"/>
  <rect x="132" y="262" width="12" height="12" fill="#333333"/>

  <!-- Dissolving pixels — green, drifting right -->
  <rect x="720" y="196" width="32" height="32" fill="#4aa32e"/>
  <rect x="776" y="252" width="24" height="24" fill="#5cb63c"/>
  <rect x="722" y="304" width="28" height="28" fill="#39962a"/>
  <rect x="784" y="336" width="18" height="18" fill="#2e7d1f"/>
  <rect x="828" y="222" width="18" height="18" fill="#6cc04a"/>
  <rect x="836" y="300" width="14" height="14" fill="#4aa32e"/>
  <rect x="868" y="258" width="12" height="12" fill="#5cb63c"/>

  <!-- ===== Wordmark ===== -->
  <text x="500" y="580" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="104" letter-spacing="4">
    <tspan fill="#3f3f3f">HOME</tspan><tspan fill="#1b6e3a">BLURB</tspan>
  </text>
</svg>
